server {
    listen 80;
    server_name radar.kuvan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name radar.kuvan.dev;

    ssl_certificate /etc/letsencrypt/live/radar.kuvan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.kuvan.dev/privkey.pem;

    root /opt/airradar-pro/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8090/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
